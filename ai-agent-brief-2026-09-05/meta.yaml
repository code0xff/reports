title: AI agents, developer tools, and agent payments — daily brief, 2026-09-05
subtitle: A card-standards body drafted a place to record what a consumer told an agent it could spend, Anthropic shipped a shopping-agent blueprint that hands that same question to Visa and Mastercard, and researchers showed what happens when nobody is holding it at all.
title_ko: AI 에이전트·개발자 도구·에이전트 결제 데일리 브리프, 2026-09-05
subtitle_ko: 카드 표준 기구는 소비자가 에이전트에게 위임한 지출 권한을 기록할 자리를 설계했고, 앤스로픽은 그 권한 확인을 비자와 마스터카드에 넘기는 쇼핑 에이전트 청사진을 내놓았다. 그리고 그 확인 장치가 아예 없을 때 무슨 일이 벌어지는지, 연구자들이 보여줬다.
