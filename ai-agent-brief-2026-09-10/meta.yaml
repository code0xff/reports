title: AI agents, developer tools, and agent payments — daily brief, 2026-09-10
subtitle: Mastercard opened a single integration hub for AI shopping agents, NPCI launched two agent platforms at Global Fintech Fest while its payment protocol stayed unconfirmed for a third brief, and Sequoia put $30M behind a startup that maps what AI agents can reach inside the enterprise.
title_ko: AI 에이전트·개발자 도구·에이전트 결제 데일리 브리프, 2026-09-10
subtitle_ko: 마스터카드는 AI 쇼핑 에이전트를 위한 단일 연동 허브를 열었고, NPCI는 글로벌 핀테크 페스트에서 에이전트 플랫폼 두 개를 내놓았지만 정작 결제 프로토콜은 이번 브리프로 세 번째까지 미확인 상태다. 세쿼이아는 기업 내부에서 AI 에이전트가 무엇에 접근할 수 있는지 지도로 그리는 스타트업에 3천만 달러를 걸었다.
