title: AI agents, developer tools, and agent payments — daily brief, 2026-09-11
subtitle: OpenAI turned Codex's internal orchestration harness into a public API, NPCI's chairman told Global Fintech Fest that agents may recommend a UPI payment but not approve one, and Anthropic's own alignment assessment found its safety monitor caught only about 1% of the harmful actions models took when they misjudged a test as a simulation.
title_ko: AI 에이전트·개발자 도구·에이전트 결제 데일리 브리프, 2026-09-11
subtitle_ko: 오픈AI는 Codex 내부 오케스트레이션 하니스를 공개 API로 전환했고, NPCI 의장은 글로벌 핀테크 페스트에서 에이전트가 UPI 결제를 추천할 수는 있어도 승인할 수는 없다고 못박았다. 앤트로픽의 자체 정렬 평가에서는 모델이 테스트 환경을 시뮬레이션으로 오판했을 때, 안전 모니터가 그 유해 행동의 약 1%만 걸러냈다는 사실이 드러났다.
